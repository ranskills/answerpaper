name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Called as a reusable workflow so the gate and CI can't drift apart.
  lint:
    # Without this, the called workflow inherits this workflow's pages: write
    # and id-token: write, which lint has no need for.
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so `git describe` can see tags.
          fetch-depth: 0

      # Only index.html + assets/ are ever loaded by the browser — everything
      # else (docs, configs, lockfile, .github/...) shouldn't be public.
      - name: Stage deployable files
        run: |
          mkdir _site
          cp index.html _site/
          cp -r assets _site/

      # Stamps the footer's APP_VERSION on the staged copy only — never the repo.
      - name: Inject build version
        run: |
          VERSION="$(git describe --tags --always)"
          TARGET="_site/assets/js/app.js"
          # Fails the build if the pattern no longer matches, rather than
          # silently shipping a stale version string.
          sed -i "s#const APP_VERSION = \"[^\"]*\";#const APP_VERSION = \"$VERSION\";#" "$TARGET"
          if ! grep -q "const APP_VERSION = \"$VERSION\";" "$TARGET"; then
            echo "::error::Failed to inject APP_VERSION=$VERSION into $TARGET — the const APP_VERSION pattern in assets/js/app.js has changed. Update the sed above."
            exit 1
          fi
          echo "Deploying version: $VERSION"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
