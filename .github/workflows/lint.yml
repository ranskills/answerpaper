name: Lint

on:
  pull_request:
  workflow_call:
  # There is deliberately no `push: branches: [main]` trigger here — the
  # deploy workflow already runs these checks on every push to main, so one
  # would execute them twice for the same commit.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
